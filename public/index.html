<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#5B5BF0" />
    <title>Ironlog</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #edf0f7;
        --card: #fff;
        --ink: #151b2b;
        --mute: #6b7488;
        --line: #e1e5ef;
        --p: #ff7a1a;
        --l: #5b5bf0;
        --w: #12a8d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1320;
          --card: #181e2f;
          --ink: #eef1fa;
          --mute: #8f99b3;
          --line: #252c42;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font: 500 15px/1.4 Manrope, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding-bottom: calc(84px + env(safe-area-inset-bottom));
      }
      main {
        max-width: 480px;
        margin: auto;
        padding: calc(18px + env(safe-area-inset-top)) 16px 0;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
      }
      h2 {
        font-size: 15px;
        font-weight: 700;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 16px;
        margin-top: 12px;
      }
      .mute {
        color: var(--mute);
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .sp {
        justify-content: space-between;
      }
      input,
      select {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        width: 100%;
        min-width: 0;
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        background: var(--bg);
        color: var(--ink);
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
      :focus-visible {
        outline: 2px solid var(--l);
        outline-offset: 2px;
      }
      .pri {
        background: var(--l);
        color: #fff;
      }
      .big {
        width: 100%;
        padding: 15px;
        font-size: 16px;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 12px 0 2px;
        scrollbar-width: none;
      }
      .chip {
        white-space: nowrap;
        border-radius: 20px;
        padding: 9px 14px;
        font-size: 14px;
      }
      .chip b {
        color: var(--p);
      }
      .bar {
        height: 10px;
        background: var(--bg);
        border-radius: 6px;
        overflow: hidden;
        margin-top: 10px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--w);
        border-radius: 6px;
        transition: width 0.3s;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .item:first-of-type {
        border-top: 0;
      }
      .x {
        background: none;
        color: var(--mute);
        padding: 6px 10px;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        border-top: 1px solid var(--line);
        display: flex;
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav button {
        flex: 1;
        background: none;
        border-radius: 0;
        padding: 11px 0 9px;
        color: var(--mute);
        font-size: 12px;
      }
      nav button.on {
        color: var(--l);
      }
      nav svg {
        display: block;
        margin: 0 auto 2px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(96px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 12px 18px;
        border-radius: 14px;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        max-width: 90%;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
      }
      .seg {
        display: flex;
        background: var(--card);
        border-radius: 12px;
        padding: 3px;
        margin-top: 12px;
      }
      .seg button {
        flex: 1;
        padding: 8px;
        background: none;
      }
      .seg .on {
        background: var(--l);
        color: #fff;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .tiles div {
        background: var(--card);
        border-radius: 14px;
        padding: 12px;
      }
      .tiles b {
        font-size: 22px;
        display: block;
      }
      .login {
        min-height: 80vh;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 14px;
      }
      .sw {
        appearance: none;
        width: 46px;
        height: 28px;
        border-radius: 14px;
        background: var(--line);
        position: relative;
        padding: 0;
        flex: none;
        border: 0;
      }
      .sw:checked {
        background: var(--l);
      }
      .sw::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.15s;
      }
      .sw:checked::after {
        left: 21px;
      }
      .step {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .step input {
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        padding: 10px 4px;
      }
      .step button {
        padding: 0 14px;
        font-size: 20px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <nav id="nav"></nav>
    <div id="toast" role="status"></div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        initializeFirestore,
        persistentLocalCache,
        persistentMultipleTabManager,
        doc,
        setDoc,
        addDoc,
        deleteDoc,
        collection,
        onSnapshot,
        query,
        where,
        increment,
        arrayUnion,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      import {
        getMessaging,
        getToken,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

      /* ===== 1. PASTE YOUR FIREBASE CONFIG HERE (see SETUP.md) ===== */
      // For Firebase JS SDK v7.20.0 and later, measurementId is optional
      const cfg = {
        apiKey: "AIzaSyBHRPhVx-CUsfK0s9rBXLPMslFqKKyVNYA",
        authDomain: "ironlog-5a42b.firebaseapp.com",
        projectId: "ironlog-5a42b",
        storageBucket: "ironlog-5a42b.firebasestorage.app",
        messagingSenderId: "459194172570",
        appId: "1:459194172570:web:b561d378bf940e33d54b23",
        measurementId: "G-7G7KPFR0NZ",
      };
      const VAPID =
        "BOvXQqP1sT2gDeg1VgyiB_tPPRFlI3JPpl9Md0yeXEgBF2dhgPxqUxAuDuC-7x7XjAfJjjrnztaokOfKr9_W018";
      /* ============================================================== */

      const app = initializeApp(cfg),
        auth = getAuth(app);
      const db = initializeFirestore(app, {
        localCache: persistentLocalCache({
          tabManager: persistentMultipleTabManager(),
        }),
      });
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      const dkey = (d = new Date()) => d.toLocaleDateString("en-CA");
      const ago = (n) => {
        const d = new Date();
        d.setDate(d.getDate() - n);
        return dkey(d);
      };
      const DEF = {
        pg: 140,
        wg: 3000,
        wOn: false,
        unit: "kg",
        ex: [
          "Bench Press",
          "Squat",
          "Deadlift",
          "Overhead Press",
          "Barbell Row",
        ],
        rp: false,
        rpt: "20:00",
        rw: false,
        rg: false,
        rgt: "18:00",
        foods: [
          { n: "Egg", g: 6 },
          { n: "Whey scoop", g: 24 },
          { n: "Paneer 100g", g: 18 },
          { n: "Dal bowl", g: 9 },
          { n: "Chicken 100g", g: 27 },
          { n: "Curd cup", g: 8 },
          { n: "Soya chunks 30g", g: 15 },
          { n: "Milk glass", g: 8 },
        ],
      };
      let S = {
          tab: "today",
          range: 7,
          ex: null,
          user: undefined,
          P: { ...DEF },
          protein: [],
          sets: [],
          water: {},
          d: {},
        },
        unsub = [],
        tt;
      const U = () => `users/${S.user.uid}`;
      const save = (o) => setDoc(doc(db, U()), o, { merge: true });
      const sumP = (d) =>
        S.protein.filter((e) => e.date === d).reduce((a, e) => a + e.g, 0);
      const e1 = (w, r) =>
        r <= 1 ? w : Math.round(w * (1 + r / 30) * 10) / 10;
      const meal = () => {
        const h = new Date().getHours();
        return h < 11
          ? "Breakfast"
          : h < 16
          ? "Lunch"
          : h < 19
          ? "Snack"
          : "Dinner";
      };
      const toast = (m) => {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("show"), 2800);
      };
      const notifOK = () => window.Notification?.permission === "granted";

      /* ---------- data ---------- */
      onAuthStateChanged(auth, (u) => {
        unsub.forEach((f) => f());
        unsub = [];
        S.user = u;
        if (!u) return render();
        const c = (p) => collection(db, `${U()}/${p}`);
        unsub = [
          onSnapshot(doc(db, U()), (s) => {
            if (s.exists()) S.P = { ...DEF, ...s.data() };
            else save(DEF);
            render();
          }),
          onSnapshot(query(c("protein"), where("date", ">=", ago(90))), (s) => {
            S.protein = s.docs.map((d) => ({ id: d.id, ...d.data() }));
            render();
          }),
          onSnapshot(c("sets"), (s) => {
            S.sets = s.docs.map((d) => ({ id: d.id, ...d.data() }));
            render();
          }),
          onSnapshot(query(c("water"), where("date", ">=", ago(90))), (s) => {
            S.water = Object.fromEntries(
              s.docs.map((d) => [d.id, d.data().ml || 0])
            );
            render();
          }),
        ];
        if (notifOK()) notif(true);
      });
      function addP(n, g, fav) {
        g = +g;
        if (!(g > 0)) {
          toast("Enter grams of protein");
          return false;
        }
        n = (n || "").trim();
        addDoc(collection(db, `${U()}/protein`), {
          date: dkey(),
          n: n || "Protein",
          g,
          m: meal(),
          ts: Date.now(),
        });
        if (fav && n && !S.P.foods.some((f) => f.n === n && f.g === g))
          save({ foods: [...S.P.foods, { n, g }] });
        navigator.vibrate?.(20);
        return true;
      }
      function wat(n) {
        const cur = S.water[dkey()] || 0;
        n = Math.max(n, -cur);
        if (!n) return;
        setDoc(
          doc(db, `${U()}/water`, dkey()),
          { date: dkey(), ml: increment(n) },
          { merge: true }
        );
      }
      function logSet() {
        const ex = S.ex || S.P.ex[0],
          w = +$("[data-d=w]").value,
          r = +$("[data-d=r]").value;
        if (!(w > 0) || !(r > 0)) return toast("Enter weight and reps");
        const prev = S.sets.filter((s) => s.ex === ex),
          best = Math.max(0, ...prev.map((s) => s.e)),
          e = e1(w, r),
          pr = prev.length > 0 && e > best;
        addDoc(collection(db, `${U()}/sets`), {
          date: dkey(),
          ex,
          w,
          r,
          e,
          pr,
          ts: Date.now(),
        });
        navigator.vibrate?.(pr ? [60, 40, 60] : 20);
        toast(
          pr
            ? `New PR! ${w}×${r}, est. 1RM ${e} ${S.P.unit}`
            : `Logged ${w}×${r}`
        );
      }
      async function notif(silent) {
        try {
          if (!window.Notification) throw 0;
          if (!silent && (await Notification.requestPermission()) !== "granted")
            return toast("Notifications are blocked in browser settings");
          const reg = await navigator.serviceWorker.ready,
            t = await getToken(getMessaging(app), {
              vapidKey: VAPID,
              serviceWorkerRegistration: reg,
            });
          await save({
            tokens: arrayUnion(t),
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
          });
          if (!silent) {
            toast("Notifications are on");
            render();
          }
        } catch (e) {
          if (!silent)
            toast(
              "Notifications need Chrome on Android, or the installed app on iPhone"
            );
        }
      }
      function csv() {
        const q = (s) => `"${String(s).replace(/"/g, '""')}"`,
          r = [
            ["type", "date", "name", "value", "reps", "est_1rm"],
            ...S.protein.map((e) => ["protein", e.date, e.n, e.g, "", ""]),
            ...S.sets.map((s) => ["set", s.date, s.ex, s.w, s.r, s.e]),
            ...Object.entries(S.water).map(([d, m]) => [
              "water",
              d,
              "",
              m,
              "",
              "",
            ]),
          ];
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([r.map((x) => x.map(q).join(",")).join("\n")], {
            type: "text/csv",
          })
        );
        a.download = "ironlog-export.csv";
        a.click();
      }

      /* ---------- charts ---------- */
      const bars = (v, lb, goal, col) => {
        const W = 320,
          H = 120,
          m = Math.max(goal || 0, ...v, 1) * 1.1,
          bw = W / v.length;
        return `<svg viewBox="0 0 ${W} ${H + 18}" width="100%" role="img">${v
          .map(
            (x, i) =>
              `<rect x="${i * bw + bw * 0.15}" y="${H - (x / m) * H}" width="${
                bw * 0.7
              }" height="${
                x ? Math.max((x / m) * H, 2) : 0
              }" rx="2" fill="${col}" opacity="${
                goal && x >= goal ? 1 : 0.45
              }"/>`
          )
          .join("")}${
          goal
            ? `<line x1="0" x2="${W}" y1="${H - (goal / m) * H}" y2="${
                H - (goal / m) * H
              }" stroke="var(--mute)" stroke-dasharray="4 4"/>`
            : ""
        }<text y="${H + 14}" font-size="10" fill="var(--mute)">${
          lb[0]
        }</text><text x="${W}" y="${
          H + 14
        }" font-size="10" text-anchor="end" fill="var(--mute)">${lb.at(
          -1
        )}</text></svg>`;
      };
      const line = (p) => {
        if (p.length < 2)
          return '<p class="mute">Log this lift on two different days to see a trend.</p>';
        const W = 320,
          H = 120,
          v = p.map((x) => x[1]),
          lo = Math.min(...v),
          sp = Math.max(...v) - lo || 1,
          xy = p.map((x, i) => [
            4 + (i / (p.length - 1)) * (W - 8),
            H - 8 - ((x[1] - lo) / sp) * (H - 16),
          ]);
        return `<svg viewBox="0 0 ${W} ${
          H + 18
        }" width="100%" role="img"><polyline points="${xy
          .map((a) => a.join(","))
          .join(
            " "
          )}" fill="none" stroke="var(--l)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${xy
          .map(
            (a) => `<circle cx="${a[0]}" cy="${a[1]}" r="3.5" fill="var(--l)"/>`
          )
          .join("")}<text y="${
          H + 14
        }" font-size="10" fill="var(--mute)">${p[0][0].slice(
          5
        )}</text><text x="${W}" y="${
          H + 14
        }" font-size="10" text-anchor="end" fill="var(--mute)">${p
          .at(-1)[0]
          .slice(5)}</text></svg>`;
      };
      const ring = (t, g) => {
        const C = 339.3,
          f = Math.min(1, t / g);
        return `<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${t} of ${g} grams"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--bg)" stroke-width="14"/><circle cx="70" cy="70" r="54" fill="none" stroke="var(--p)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${
          C * f
        } ${C}" transform="rotate(-90 70 70)"/><text x="70" y="74" text-anchor="middle" font-size="32" font-weight="800" fill="var(--ink)">${t}</text><text x="70" y="94" text-anchor="middle" font-size="12" fill="var(--mute)">of ${g} g</text></svg>`;
      };

      /* ---------- views ---------- */
      const exSel = (ex) =>
        `<select data-a="ex" aria-label="Exercise">${S.P.ex
          .map(
            (x) => `<option ${x === ex ? "selected" : ""}>${esc(x)}</option>`
          )
          .join("")}</select>`;
      function vToday() {
        const P = S.P,
          d = dkey(),
          t = sumP(d),
          left = P.pg - t,
          m = S.water[d] || 0,
          es = S.protein
            .filter((e) => e.date === d)
            .sort((a, b) => b.ts - a.ts);
        return `<h1>Hi, ${esc(
          (S.user.displayName || "there").split(" ")[0]
        )}</h1><p class="mute">${new Date().toLocaleDateString("en-IN", {
          weekday: "long",
          day: "numeric",
          month: "long",
        })}</p>
<div class="card"><div class="row sp">${ring(
          t,
          P.pg
        )}<div style="text-align:right"><h2>${
          left > 0 ? left + " g to go" : "Goal reached"
        }</h2><p class="mute">${
          left > 0 ? "Tap a food to log it" : "Anything extra is a bonus"
        }</p></div></div>
<div class="chips">${P.foods
          .map(
            (f, i) =>
              `<button class="chip" data-a="qa" data-i="${i}">${esc(f.n)} <b>+${
                f.g
              }</b></button>`
          )
          .join("")}</div>
<div class="row" style="margin-top:10px"><input data-d="fn" placeholder="Other food" value="${esc(
          S.d.fn || ""
        )}"><input data-d="fg" type="number" inputmode="decimal" placeholder="g" style="width:84px" value="${
          S.d.fg || ""
        }"><button class="pri" data-a="add">Add</button></div>
<label class="row mute" style="margin-top:10px"><input type="checkbox" data-d="ff" ${
          S.d.ff ? "checked" : ""
        } style="width:auto"> Save as favourite</label></div>
${
  P.wOn
    ? `<div class="card"><div class="row sp"><h2>Water</h2><span class="mute">${m} / ${
        P.wg
      } ml</span></div><div class="bar"><i style="width:${Math.min(
        100,
        (m / P.wg) * 100
      )}%"></i></div><div class="row" style="margin-top:12px"><button class="chip" style="flex:1" data-a="wat" data-n="250">+250 ml</button><button class="chip" style="flex:1" data-a="wat" data-n="500">+500 ml</button><button class="x" data-a="wat" data-n="-250">Undo</button></div></div>`
    : ""
}
<div class="card"><h2>Today's log</h2>${
          es.length
            ? es
                .map(
                  (e) =>
                    `<div class="item"><div>${esc(e.n)}<div class="mute">${
                      e.m
                    }</div></div><div class="row"><b>${
                      e.g
                    } g</b><button class="x" data-a="del" data-c="protein" data-id="${
                      e.id
                    }" aria-label="Delete">✕</button></div></div>`
                )
                .join("")
            : '<p class="mute" style="margin-top:6px">Nothing logged yet.</p>'
        }</div>`;
      }
      function vLift() {
        const P = S.P,
          ex = S.ex || P.ex[0],
          mine = S.sets.filter((s) => s.ex === ex).sort((a, b) => b.ts - a.ts),
          last = mine[0],
          best = mine.reduce((a, s) => (!a || s.e > a.e ? s : a), null),
          stp = P.unit === "kg" ? 2.5 : 5,
          w = S.d.w ?? last?.w ?? "",
          r = S.d.r ?? last?.r ?? "",
          today = S.sets
            .filter((s) => s.date === dkey())
            .sort((a, b) => b.ts - a.ts),
          bb = {};
        S.sets.forEach((s) => {
          if (!bb[s.ex] || s.e > bb[s.ex].e) bb[s.ex] = s;
        });
        return `<h1>Lift</h1><div class="card"><div class="row">${exSel(
          ex
        )}<button data-a="newex" aria-label="Add exercise">+</button></div>
<p class="mute" style="margin:10px 0">${
          best
            ? `Best ${best.w} ${P.unit} × ${best.r}, est. 1RM ${best.e} ${P.unit}`
            : "No sets yet for this lift"
        }</p>
<div class="row"><div style="flex:1"><div class="mute">Weight (${
          P.unit
        })</div><div class="step"><button data-a="step" data-k="w" data-n="-${stp}">−</button><input data-d="w" type="number" inputmode="decimal" value="${w}"><button data-a="step" data-k="w" data-n="${stp}">+</button></div></div>
<div style="flex:1"><div class="mute">Reps</div><div class="step"><button data-a="step" data-k="r" data-n="-1">−</button><input data-d="r" type="number" inputmode="numeric" value="${r}"><button data-a="step" data-k="r" data-n="1">+</button></div></div></div>
<button class="pri big" style="margin-top:14px" data-a="log">Log set</button></div>
<div class="card"><h2>Today</h2>${
          today.length
            ? today
                .map(
                  (s) =>
                    `<div class="item"><div>${esc(s.ex)}${
                      s.pr ? " 🏆" : ""
                    }</div><div class="row"><b>${s.w} × ${
                      s.r
                    }</b><button class="x" data-a="del" data-c="sets" data-id="${
                      s.id
                    }" aria-label="Delete">✕</button></div></div>`
                )
                .join("")
            : '<p class="mute" style="margin-top:6px">No sets yet today.</p>'
        }</div>
<div class="card"><h2>Personal records</h2>${
          Object.keys(bb).length
            ? Object.entries(bb)
                .map(
                  ([k, s]) =>
                    `<div class="item"><div>${esc(k)}<div class="mute">${
                      s.date
                    }</div></div><div style="text-align:right"><b>${s.w} ${
                      P.unit
                    } × ${s.r}</b><div class="mute">1RM ${
                      s.e
                    }</div></div></div>`
                )
                .join("")
            : '<p class="mute" style="margin-top:6px">Your records will show up here.</p>'
        }</div>`;
      }
      function vStats() {
        const P = S.P,
          R = S.range,
          days = Array.from({ length: R }, (_, i) => ago(R - 1 - i)),
          v = days.map(sumP),
          lg = v.filter((x) => x > 0),
          avg = lg.length
            ? Math.round(lg.reduce((a, b) => a + b) / lg.length)
            : 0,
          hit = v.filter((x) => x >= P.pg).length,
          lb = [days[0].slice(5), days.at(-1).slice(5)];
        let st = 0,
          i = sumP(dkey()) >= P.pg ? 0 : 1;
        while (i < 90 && sumP(ago(i)) >= P.pg) {
          st++;
          i++;
        }
        const ex = S.ex || P.ex[0],
          bd = {};
        S.sets
          .filter((s) => s.ex === ex)
          .forEach((s) => {
            bd[s.date] = Math.max(bd[s.date] || 0, s.e);
          });
        const pts = Object.entries(bd).sort().slice(-30),
          inR = S.sets.filter((s) => s.date >= days[0]),
          T = (b, l) => `<div><b>${b}</b><span class="mute">${l}</span></div>`;
        return `<h1>Stats</h1><div class="seg">${[7, 30, 90]
          .map(
            (n) =>
              `<button class="${
                R === n ? "on" : ""
              }" data-a="rng" data-n="${n}">${n} days</button>`
          )
          .join("")}</div>
<div class="tiles">${T(avg, "avg g/day")}${T(hit + "/" + R, "goal days")}${T(
          st,
          "day streak"
        )}</div>
<div class="card"><h2>Protein</h2><div style="margin-top:8px">${bars(
          v,
          lb,
          P.pg,
          "var(--p)"
        )}</div></div>
${
  P.wOn
    ? `<div class="card"><h2>Water</h2><div style="margin-top:8px">${bars(
        days.map((d) => S.water[d] || 0),
        lb,
        P.wg,
        "var(--w)"
      )}</div></div>`
    : ""
}
<div class="tiles">${T(new Set(inR.map((s) => s.date)).size, "workouts")}${T(
          inR.length,
          "sets"
        )}${T(inR.filter((s) => s.pr).length, "new PRs")}</div>
<div class="card"><div class="row sp"><h2>Strength trend</h2><div style="width:55%">${exSel(
          ex
        )}</div></div><p class="mute" style="margin:6px 0 8px">Estimated 1RM (${
          P.unit
        }), best set per day</p>${line(pts)}</div>`;
      }
      function vSet() {
        const P = S.P,
          L = (a, b) =>
            `<div class="row sp item"><span>${a}</span><span class="row">${b}</span></div>`,
          sw = (k, v) =>
            `<input class="sw" type="checkbox" data-s="${k}" aria-label="${k}" ${
              v ? "checked" : ""
            }>`;
        return `<h1>Settings</h1><div class="card"><h2>Goals</h2>
${L(
  "Daily protein (g)",
  `<input type="number" data-s="pg" value="${P.pg}" style="width:90px">`
)}
${L(
  "Weight unit",
  `<select data-s="unit" style="width:90px"><option ${
    P.unit === "kg" ? "selected" : ""
  }>kg</option><option ${
    P.unit === "lb" ? "selected" : ""
  }>lb</option></select>`
)}
${L("Track water", sw("wOn", P.wOn))}${
          P.wOn
            ? L(
                "Daily water (ml)",
                `<input type="number" data-s="wg" value="${P.wg}" style="width:90px">`
              )
            : ""
        }</div>
<div class="card"><h2>Reminders</h2>${
          notifOK()
            ? ""
            : '<button class="pri big" style="margin:10px 0" data-a="notif">Turn on notifications</button>'
        }
${L(
  "Protein check-in",
  sw("rp", P.rp) +
    `<input type="time" data-s="rpt" value="${P.rpt}" style="width:110px">`
)}
${L(
  "Gym time",
  sw("rg", P.rg) +
    `<input type="time" data-s="rgt" value="${P.rgt}" style="width:110px">`
)}
${P.wOn ? L("Water, every 2 hours", sw("rw", P.rw)) : ""}
<p class="mute" style="margin-top:8px">Protein and water reminders stay quiet once you hit your goal. The gym reminder stays quiet if you already logged a set.</p></div>
<div class="card"><h2>Favourite foods</h2>${P.foods
          .map(
            (f, i) =>
              `<div class="item"><span>${esc(f.n)}, ${
                f.g
              } g</span><button class="x" data-a="rmfav" data-i="${i}" aria-label="Remove">✕</button></div>`
          )
          .join("")}</div>
<div class="card"><button class="big" data-a="csv">Export data (CSV)</button><button class="big" style="margin-top:8px" data-a="out">Sign out</button></div>`;
      }
      const TABS = [
        ["today", "Today", '<circle cx="12" cy="12" r="8"/>'],
        ["lift", "Lift", '<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'],
        ["stats", "Stats", '<path d="M5 20v-8M12 20V5M19 20v-5"/>'],
        [
          "set",
          "Settings",
          '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
        ],
      ];
      function render() {
        const a = $("#app");
        if (S.user === undefined) return;
        if (!S.user) {
          a.innerHTML =
            '<div class="login"><h1 style="font-size:36px">Ironlog</h1><p class="mute">Protein, lifts and water. Quick to log, easy to read.</p><button class="pri big" data-a="in">Continue with Google</button></div>';
          $("#nav").innerHTML = "";
          return;
        }
        a.innerHTML = { today: vToday, lift: vLift, stats: vStats, set: vSet }[
          S.tab
        ]();
        $("#nav").innerHTML = TABS.map(
          ([k, l, p]) =>
            `<button class="${
              S.tab === k ? "on" : ""
            }" data-a="tab" data-t="${k}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">${p}</svg>${l}</button>`
        ).join("");
      }

      /* ---------- events ---------- */
      document.addEventListener("click", (ev) => {
        const b = ev.target.closest("[data-a]");
        if (!b || b.tagName === "SELECT") return;
        const { a, i, n, k, c, id } = b.dataset;
        if (a === "tab") {
          S.tab = b.dataset.t;
          render();
          scrollTo(0, 0);
        } else if (a === "qa") {
          const f = S.P.foods[i];
          addP(f.n, f.g);
        } else if (a === "add") {
          if (addP(S.d.fn, S.d.fg, S.d.ff)) {
            S.d.fn = S.d.fg = "";
            render();
          }
        } else if (a === "del") deleteDoc(doc(db, `${U()}/${c}`, id));
        else if (a === "wat") wat(+n);
        else if (a === "step") {
          const el = $(`[data-d=${k}]`);
          S.d[k] = Math.max(0, Math.round(((+el.value || 0) + +n) * 10) / 10);
          render();
        } else if (a === "log") logSet();
        else if (a === "newex") {
          const x = prompt("Exercise name")?.trim();
          if (x && !S.P.ex.includes(x)) {
            S.ex = x;
            delete S.d.w;
            delete S.d.r;
            save({ ex: [...S.P.ex, x] });
          }
        } else if (a === "rng") {
          S.range = +n;
          render();
        } else if (a === "in")
          signInWithPopup(auth, new GoogleAuthProvider()).catch((e) =>
            toast("Sign-in failed: " + e.code)
          );
        else if (a === "out") signOut(auth);
        else if (a === "notif") notif();
        else if (a === "rmfav")
          save({ foods: S.P.foods.filter((_, j) => j !== +i) });
        else if (a === "csv") csv();
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.dataset.a === "ex") {
          S.ex = t.value;
          delete S.d.w;
          delete S.d.r;
          render();
        } else if (t.dataset.s) {
          const k = t.dataset.s,
            v =
              t.type === "checkbox"
                ? t.checked
                : t.type === "number"
                ? +t.value
                : t.value;
          save({ [k]: v });
          if (["rp", "rg", "rw"].includes(k) && v && !notifOK()) notif();
        }
      });
      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.dataset.d)
          S.d[t.dataset.d] = t.type === "checkbox" ? t.checked : t.value;
      });
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
